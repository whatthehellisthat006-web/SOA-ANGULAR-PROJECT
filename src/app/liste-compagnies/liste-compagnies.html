<div class="container mt-4">
  <div class="card shadow mb-4">
    <div class="card-header py-3">
      <h6 class="m-0 font-weight-bold text-primary">Gestion des Compagnies</h6>
    </div>
    <div class="card-body">
      <div class="col-sm-6 col-md-6 col-lg-6 mb-4">
        <app-update-compagnie [compagnie]="updatedCompagnie"
                              (compagnieUpdated)="compagnieUpdated($event)"
                              [ajout]="ajout">
        </app-update-compagnie>
      </div>

      <table class="table table-striped align-middle">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nom Compagnie</th>
            <th>Description</th>
            <th class="text-center">Action</th>
          </tr>
        </thead>
        <tbody>
          @for (comp of compagnies; track comp.idCompagnie) {
            <tr>
              <td>{{ comp.idCompagnie }}</td>
              <td>{{ comp.nom }}</td>
              <td>{{ comp.description }}</td>
              <td class="text-center">
                <a class="btn btn-success btn-sm" (click)="updateCompagnie(comp)">Editer</a>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="text-center text-muted">Aucune compagnie trouvée !</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
